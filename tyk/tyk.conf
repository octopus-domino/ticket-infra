{
  "listen_port": 8080,
  "control_api_port": 8081,
  "secret": "",
  "template_path": "/opt/tyk-gateway/templates",
  "app_path": "/opt/tyk-gateway/apps",
  "use_db_app_configs": false,
  "enable_analytics": false,
  "enable_jsvm": false,
  "hash_keys": true,
  "storage": {
    "type": "redis",
    "host": "redis",
    "port": 6379,
    "database": 0,
    "optimisation_max_idle": 5,
    "optimisation_max_active": 20
  },
  "local_session_cache": { "disable_cached_session_state": true },
  "http_server_options": {
    "enable_strict_routes": true,
    "read_timeout": 30,
    "write_timeout": 120
  },
  "proxy_default_timeout": 120,
  "log_level": "warn"
}
