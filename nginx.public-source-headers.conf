proxy_ssl_server_name on;
resolver 127.0.0.11 valid=60s ipv6=off;
resolver_timeout 5s;
proxy_ssl_name $private_source_host;
proxy_ssl_verify on;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
proxy_ssl_verify_depth 4;
proxy_set_header Cookie "";
proxy_set_header Authorization "";
proxy_set_header Origin "";
proxy_set_header Referer "";
proxy_set_header User-Agent "Mozilla/5.0 CoDoc-Public-House-Reader/1.0";
proxy_hide_header Set-Cookie;
proxy_connect_timeout 10s;
proxy_read_timeout 25s;
proxy_send_timeout 15s;
proxy_buffering on;
# Public APIs can return large security headers even when the body is small.
proxy_buffer_size 64k;
proxy_buffers 8 64k;
proxy_busy_buffers_size 128k;
proxy_cache off;
access_log off;
