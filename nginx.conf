map "$request_method:$uri" $codoc_heavy_request {
    default "";
    ~^POST:/api/(recognition|guest/recognition|recognize|export|guest/export|generate|guest/generate|import)(/|$) "heavy";
    ~^POST:/api/journeys$ "heavy";
    ~^POST:/api/journeys/(artwork|media|routes/road)$ "heavy";
    ~^POST:/api/journeys/poetry/?$ "heavy";
    ~^POST:/api/journeys/routes/places/themed/enrich$ "heavy";
    ~^POST:/api/public/workflows/.*/pdf$ "heavy";
    ~^GET:/api/journeys/.*/pdf$ "heavy";
}
limit_conn_zone $codoc_heavy_request zone=codoc_heavy:1m;
map $uri $codoc_robots {
    default "";
    ~^/(app|api|login|register|auth|oauth2|sites|start|s|d|manage|issues|flows)(/|$) "noindex, nofollow";
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    error_page 404 /404.html;

    # === CSP: всё в одну строку! ===
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://tile.openstreetmap.org https://www.wikidata.org https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://tiles.openfreemap.org https://drawio.codoc.site https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://yastatic.net; frame-src blob: https://mc.yandex.ru https://mc.yandex.com https://drawio.codoc.site https://forms.yandex.ru https://forms.yandex.com https://cloud.yandex.ru; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag $codoc_robots always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;

    # Увеличьте лимит — документ может быть больше 20 МБ
    client_max_body_size 64m;

    # Отключаем буферизацию запроса: тело стримится напрямую в Spring,
    # без записи во временные файлы. Это устраняет и 500, и OOM-риск.
    proxy_request_buffering off;

    # Большой буфер — на случай, если Nginx всё же решит буферизовать
    client_body_buffer_size 1m;

    # Public SEO pages exist as HTML; unknown public URLs return a real 404.
    location / {
        try_files $uri $uri/ =404;
    }

    # Public workflow routes and wildcard site roots.
    location ~ ^/(start(?:/.*)?|s(?:/.*)?|sites(?:/.*)?|d(?:/.*)?|manage(?:/.*)?|issues(?:/.*)?|flows(?:/.*)?)$ {
        try_files /app.html =404;
    }
    # Wildcard hosts are routed by the SPA; existing root-site SEO stays intact.
    if ($host ~* "^(?!www\.)(?!drawio\.)(?!api\.)(?!go\.)[^.]+\.codoc\.site$") { set $journey_host 1; }
    error_page 418 = /app.html;
    location = / {
        if ($journey_host = 1) { return 418; }
        try_files /index.html =404;
    }

    # Auth and workspace remain SPA routes. API/OAuth locations below are unchanged.
    location ~ ^/(app(?:/.*)?|login/?|register/?|auth/callback/?)$ {
        try_files /app.html =404;
    }

    location ~ \.html$ {
        expires -1;
        try_files $uri =404;
    }

    location = /404.html {
        internal;
    }

    # API
    location /api/ {
        # Reject concurrent large bodies before JSON decoding in the JVM.
        limit_conn codoc_heavy 1;
        limit_conn_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering off;    # ← дублируем для надёжности

        # Spring может долго отвечать на /generate/sync
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # OAuth2
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /login/oauth2/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
