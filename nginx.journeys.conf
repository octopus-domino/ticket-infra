# Include beside the existing www.codoc.site server. Requires a wildcard certificate.
server {
    listen 80;
    server_name *.codoc.site;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name *.codoc.site;
    ssl_certificate /etc/letsencrypt/live/codoc-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codoc-wildcard/privkey.pem;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    client_max_body_size 64m;
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
server {
    listen 443 ssl;
    server_name go.codoc.site;
    ssl_certificate /etc/letsencrypt/live/codoc-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codoc-wildcard/privkey.pem;
    add_header Referrer-Policy no-referrer always;
    location ~ ^/([A-Za-z0-9]{12})$ {
        proxy_pass http://127.0.0.1:8090/api/links/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
    location / { return 404; }
}
