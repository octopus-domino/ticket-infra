# Fixed upstream; never an arbitrary URL proxy.
location ^~ /private-journey/sources/gorod/ {
    if ($uri !~ "^/private-journey/sources/gorod/(public_api/maps/get_nearest/|facilities/search/ajax/|facilities/[0-9]+/(info|programs)/)$") { return 404; }
    limit_except GET { deny all; }
    rewrite ^/private-journey/sources/gorod/(.*)$ /$1 break;
    proxy_pass https://gorod.gov.spb.ru;
    proxy_set_header Host gorod.gov.spb.ru;
    include /etc/nginx/public-source-headers.conf;
}

