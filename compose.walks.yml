# Optional private HTTP bridge for ni-c/osm-mcp. No ports or application secrets are exposed.
services:
  osm-mcp:
    image: codoc-osm-mcp
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [api]
    healthcheck:
      test: [CMD, python3, -c, "import socket; socket.create_connection(('127.0.0.1',8000),timeout=2).close()"]
      interval: 15s
      timeout: 3s
      start_period: 30s
      retries: 3
  app:
    environment:
      OSM_MCP_ENABLED: "true"
      OSM_MCP_URL: http://osm-mcp:8000/mcp
