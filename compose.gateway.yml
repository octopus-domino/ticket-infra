name: codoc-gateway
services:
  gateway:
    image: tykio/tyk-gateway:v5.16.0
    restart: unless-stopped
    ports: ["127.0.0.1:8088:8080"]
    environment:
      TYK_GW_SECRET: ${TYK_ADMIN_SECRET:?Set TYK_ADMIN_SECRET in the root .env}
      TYK_GW_STORAGE_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
      GOMAXPROCS: "1"
      GOMEMLIMIT: 300MiB
    mem_limit: 384m
    volumes:
      - ./tyk/tyk.conf:/opt/tyk-gateway/tyk.conf:ro
      - ./tyk/apps:/opt/tyk-gateway/apps:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [api]
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 96mb --maxmemory-policy noeviction"]
    mem_limit: 160m
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [api]
volumes:
  redis-data:
networks:
  api:
    external: true
    name: codoc-client-api
