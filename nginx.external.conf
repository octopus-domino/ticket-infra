# Install as /etc/nginx/sites-available/codoc, not as the container's nginx.conf.
# Certificates already exist in the user's current installation.
server {
    listen 80;
    listen [::]:80;
    server_name codoc.site www.codoc.site;
    return 301 https://www.codoc.site$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name codoc.site;

    ssl_certificate /etc/letsencrypt/live/codoc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codoc.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://www.codoc.site$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.codoc.site;
    ssl_certificate /etc/letsencrypt/live/codoc.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codoc.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(self)" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://api-maps.yandex.ru https://*.maps.yandex.net https://mc.yandex.ru https://mc.yandex.com https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api-maps.yandex.ru https://*.maps.yandex.net https://tile.openstreetmap.org https://tiles.openfreemap.org https://www.wikidata.org https://commons.wikimedia.org https://upload.wikimedia.org https://thumb.wikimedia.org https://drawio.codoc.site https://mc.yandex.ru https://mc.yandex.com https://mc.yandex.az https://mc.yandex.by https://mc.yandex.co.il https://mc.yandex.com.am https://mc.yandex.com.ge https://mc.yandex.com.tr https://mc.yandex.ee https://mc.yandex.fr https://mc.yandex.kg https://mc.yandex.kz https://mc.yandex.lt https://mc.yandex.lv https://mc.yandex.md https://mc.yandex.tj https://mc.yandex.tm https://mc.yandex.uz https://yastatic.net; frame-src 'self' blob: https://drawio.codoc.site https://forms.yandex.ru https://forms.yandex.com https://cloud.yandex.ru https://mc.yandex.ru https://mc.yandex.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self';" always;

    # One authoritative security policy; preserve backend Cache-Control headers.
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    client_max_body_size 64m;
    client_body_buffer_size 1m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This Nginx is the internet-facing edge; overwrite untrusted forwarding headers.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location = /client-api { return 308 /client-api/; }
    location ^~ /client-api/ {
        # No URI suffix: preserve /client-api/, which Tyk strips itself.
        proxy_pass http://127.0.0.1:8088;
    }
    # Never expose the Tyk management API or Spring operational endpoints.
    location ^~ /tyk/ { return 404; }
    location ^~ /actuator/ { return 404; }
    location / {
        # Installer renders this port for Compose (8090) or legacy H2 (8080).
        proxy_pass http://127.0.0.1:8090;
    }
}
