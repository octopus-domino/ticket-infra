name: codoc
services:
  app:
    image: codoc-app
    build:
      context: ..
      dockerfile: ticket-infra/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODOC_HTTP_PORT:-8090}:80"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${DB_SCHEMA_MODE:-validate}
      JWT_SECRET: ${JWT_SECRET:?Set a random JWT_SECRET in .env}
      APP_SECRETS_ENCRYPTION_KEY: ${APP_SECRETS_ENCRYPTION_KEY:?Set a stable encryption key}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-disabled}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-disabled}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SSL: ${SMTP_SSL:-true}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      EMAIL_FROM: ${EMAIL_FROM:-${SMTP_USER:-}}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?Set APP_FRONTEND_URL}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1024m -XX:MaxDirectMemorySize=128m -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError"
      OMP_THREAD_LIMIT: "1"
      MALLOC_ARENA_MAX: "2"
      SERVER_TOMCAT_THREADS_MAX: "32"
      SERVER_TOMCAT_THREADS_MIN_SPARE: "4"
      SERVER_TOMCAT_MAX_CONNECTIONS: "128"
      SERVER_TOMCAT_ACCEPT_COUNT: "32"
      APP_CLIENT_API_TYK_URL: http://gateway:8081
      APP_CLIENT_API_TYK_SECRET: ${TYK_ADMIN_SECRET:?Set a random TYK_ADMIN_SECRET}
      APP_CLIENT_API_PUBLIC_URL: ${CLIENT_API_PUBLIC_URL:?Set CLIENT_API_PUBLIC_URL}
      APP_RECOGNITION_OLLAMA_ENABLED: "false"
      TWOGIS_API_KEY: ${TWOGIS_API_KEY:-}
      APP_JOURNEYS_WIKIMAPIA_KEY: ${WIKIMAPIA_API_KEY:-}
      APP_JOURNEYS_YANDEX_API_KEY: ${YANDEX_MAPS_API_KEY:-}
      APP_HOITH_GPKG_PATH: /app/imports/hoith.gpkg
      APP_HOITH_IMPORT_ON_STARTUP: ${HOITH_IMPORT_ON_STARTUP:-false}
      APP_HOITH_CITIES: ${HOITH_CITIES:-}
      APP_HOITH_REFRESH_ON_START: ${HOITH_REFRESH_ON_START:-false}
      APP_HOITH_BEFORE_YEAR: ${HOITH_BEFORE_YEAR:-1945}
      APP_HOITH_BACKGROUND: ${HOITH_BACKGROUND:-false}
      APP_HOITH_MIN_FREE_SPACE_MB: ${HOITH_MIN_FREE_SPACE_MB:-768}
      APP_MYSTIC_REFRESH_ON_START: ${MYSTIC_REFRESH_ON_START:-false}
      APP_JOURNEYS_GEOCODER_URL: ${GEOCODER_URL:-https://photon.komoot.io/api/}
      APP_JOURNEYS_OVERPASS_URL: ${OVERPASS_URL:-https://overpass-api.de/api/interpreter}
      APP_POETRY_POEMSHIP_URL: ${APP_POETRY_POEMSHIP_URL:-https://poemship.com/mcp}
      APP_POETRY_POETREE_URL: ${APP_POETRY_POETREE_URL:-https://versologie.cz/poetree/api}
      OSM_MCP_ENABLED: ${OSM_MCP_ENABLED:-false}
      OSM_MCP_URL: ${OSM_MCP_URL:-http://localhost:8000/mcp}
      COMMONS_MCP_ENABLED: ${COMMONS_MCP_ENABLED:-true}
      COMMONS_MCP_URL: ${COMMONS_MCP_URL:-https://gateway.pipeworx.io/commons-wikimedia/mcp}
      WORKFLOW_ADMIN_USER_IDS: ${WORKFLOW_ADMIN_USER_IDS:-}
      APP_CONNECTORS_ALLOWED_ORIGINS: ${CONNECTOR_ALLOWED_ORIGINS:-}
    mem_limit: 1792m
    mem_reservation: 1024m
    cpus: 1.5
    healthcheck:
      test: [CMD-SHELL, 'code=$$(curl -s --max-time 3 -o /dev/null -w "%{http_code}" http://127.0.0.1:8080/actuator/health); [ "$$code" = 200 ] || [ "$$code" = 401 ]']
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 30
    volumes:
      - ${CODOC_APP_STORAGE:-app-data}:/app/data
      - ${HOITH_IMPORT_DIR:-../data/imports}:/app/imports:ro
    networks: [api]
  gateway:
    image: tykio/tyk-gateway:v5.16.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      TYK_GW_SECRET: ${TYK_ADMIN_SECRET:?Set a random TYK_ADMIN_SECRET}
      TYK_GW_STORAGE_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      GOMAXPROCS: "1"
      GOMEMLIMIT: 300MiB
    mem_limit: 384m
    volumes:
      - ./tyk/tyk.conf:/opt/tyk-gateway/tyk.conf:ro
      - ./tyk/apps:/opt/tyk-gateway/apps:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [api]
  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 96mb --maxmemory-policy noeviction"]
    mem_limit: 160m
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [api]
volumes:
  app-data:
  redis-data:
networks:
  api:
